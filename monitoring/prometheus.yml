global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: ontracker-staging
    static_configs:
      - targets: ['host.docker.internal:8090']

  - job_name: ontracker-prod
    static_configs:
      - targets: ['host.docker.internal:8100']
