# Monitoring stack for the deployed app. Prometheus scrapes the staging/prod
# containers' /metrics and evaluates alert.rules.yml. Runs as persistent infra
# (host port 9091 — 9090 is used by another app). Started once, outside the
# pipeline; the Jenkins Monitoring stage verifies integration against it.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prom_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prom_data:
